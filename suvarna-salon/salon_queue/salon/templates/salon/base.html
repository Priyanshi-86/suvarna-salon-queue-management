{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf" content="{{ csrf_token }}"><title>Suvarna Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'salon/style.css' %}"></head>
<body>
<header class="top"><a class="brand" href="{% url 'home' %}"><span class="mono">S</span><span class="serif">Suvarna</span></a>
<div class="lang"><button data-lang="en">EN</button><button data-lang="hi">हिं</button><button data-lang="gu">ગુ</button></div>{% if request.user.is_authenticated %}<a class="logout" href="{% url 'logout' %}">Logout</a>{% endif %}</header>
<main {% block mainattr %}{% endblock %}>{% block content %}{% endblock %}</main>
{% with u=request.resolver_match.url_name %}
<nav class="tabs"><a href="{% url 'home' %}" class="{% if u == 'home' %}on{% endif %}" data-t="nav_home"></a>
<a href="{% url 'book' %}" class="{% if u == 'book' %}on{% endif %}" data-t="nav_book"></a>
<a href="{% url 'my_bookings' %}" class="{% if u == 'my_bookings' %}on{% endif %}" data-t="nav_my"></a></nav>{% endwith %}
<script src="{% static 'salon/app.js' %}"></script>{% block scripts %}{% endblock %}
</body></html>
